<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2430" />
    <meta name="description" content="课间十分钟 —— 初中校园主题像素剧情游戏" />
    <!-- 内联 SVG 图标：一块黑板。省掉一次网络请求，也免得控制台报 favicon 404 -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b2430'/%3E%3Crect x='2' y='3' width='12' height='8' fill='%232f6b4f'/%3E%3Crect x='4' y='5' width='6' height='1' fill='%23e8e6d9'/%3E%3Crect x='4' y='7' width='8' height='1' fill='%23e8e6d9'/%3E%3Crect x='1' y='12' width='14' height='2' fill='%23c9a227'/%3E%3C/svg%3E"
    />
    <title>课间十分钟</title>
  </head>
  <body>
    <div id="app">
      <!-- 像素画面层 -->
      <canvas id="stage" aria-label="游戏画面"></canvas>
      <!-- 文本 / 菜单覆盖层（中文文本走 DOM，渲染清晰且天然适配各尺寸） -->
      <div id="overlay" class="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
