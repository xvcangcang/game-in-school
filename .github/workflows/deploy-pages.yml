# 把游戏构建产物发布到 GitHub Pages。
#
# 为什么能直接跑：vite.config.ts 里 base 是 './'，产物用相对路径引用资源，
# 因此放在 https://<user>.github.io/<repo>/ 这种子目录下也不会 404。
# 项目用的是内存场景路由（不走 URL history），所以不需要 404.html 回退。
#
# 注意：Pages 上只有静态文件，没有 Node 服务端，所以 /api/llm 代理不存在。
# 玩家需要在「设置 → AI 剧情」里改成「浏览器直连」并填自己的 Key，
# 或者直接关掉 AI 用内置事件库玩（功能完整）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 ci 而不是 install：锁文件不一致时直接失败，避免构建出不可复现的产物
      - name: Install dependencies
        run: npm ci

      # 顺带把类型检查也当门禁（npm run build 里已经包含 tsc --noEmit）
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
